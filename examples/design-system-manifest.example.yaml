# Example design-system manifest — fill this in per project.
# Swap this file to reuse the same agent/skill across different design systems.

harness:
  mode: "lite"             # lite: core skill + tool checks + one critic pass. full: every record and the full rubric

platform:
  targets: ["claude-code", "claude-design"]   # same manifest drives both — see skills/design-agent/reference/platform-adapters.md
  claudeDesign:
    designSystemUrl: ""       # filled in on first export
    markAsDefault: true       # every new Design canvas applies Acme without being asked
    recordStore: "repo"       # briefs, reports and the design index stay in the repo
    canvasBoards:
      phone: { w: 390, h: 844 }
      desktop: { w: 1440, h: 900 }

meta:
  name: "Acme Product UI"
  version: "1.0.0"
  framework: "react"
  stylingEngine: "tailwind"
  decisionProtocol: "always-ask"   # always-ask | ask-major-only | auto-apply
  claudeMd:
    path: "CLAUDE.md"     # always-loaded summary of this manifest — see examples/CLAUDE.example.md
    required: true        # the skill halts if it is missing or its version stamp differs from meta.version
  brandExclusions:
    - "#3B82F6 default SaaS blue"
    - "glass morphism"
    - "drop shadows for depth"
    - "Inter / Roboto / Space Grotesk as primary display font"

brandGuidelines:           # Acme's own guidelines; the tools warn when something meant to follow them doesn't
  - profile: "brand/acme-brand.example.yaml"
    applies: "always"      # this is Acme's product: the manifest and every page are checked

contentPolicy:            # say less: every block short, and a first screen that's scanned, not read
  maxWordsPerBlock: 30     # a paragraph, helper text or description; the rest goes behind a disclosure
  maxSentencesPerBlock: 2
  maxIntroWords: 20        # the line under a page or section title
  maxWordsFirstScreen: 60  # before the first scroll at the narrowest width, so the title and primary action stand out in 3 s
  maxWordsPerScreen: 250
  maxNumbersInProse: 2     # more figures than this in a sentence become stats, a table or a chart
  taskTime: { readingWordsPerMinute: 200, secondsPerField: 8, secondsPerChoice: 3 }   # the 3-minute estimate
  persistentChrome:        # the top bar, sidebars, anything fixed or sticky: on every screen, so it holds only what every screen needs
    maxInfoItems: 0        # beyond the logo, page title, navigation and controls; mark a real exception data-essential (e.g. a live countdown)
    # ambientTerms: roles, plans, environments, "signed in as": default list in tools/screenshots.py
  # Long-form text (articles, legal, help) sits in [data-longform] and is exempt.

antiAiDesign:
  repetition: { enabled: true, minWords: 3, figures: true }
  typefaces:
    maxFamilies: 2         # plus one mono

color:
  neutrals:
    background: "slate-50"
    surface: "white"
    border: "slate-200"
    textPrimary: "slate-900"
    textSecondary: "slate-600"
    temperature: "cool"
  accents:
    primary: "teal-500"
    onPrimary: "slate-900"   # white on teal-500 is ~2.5:1 and fails AA; slate-900 passes
    secondary: "amber-500"
    success: "green-500"
    warning: "amber-500"
    error: "red-500"
    info: "sky-500"
  contrastStandard: "WCAG-AA"
  themes:
    - { id: "light", name: "Light" }
  resolved:                    # real values for Claude Design (Tailwind v3 palette)
    neutrals.background:     { light: "#f8fafc" }   # slate-50
    neutrals.surface:        { light: "#ffffff" }   # white
    neutrals.border:         { light: "#e2e8f0" }   # slate-200
    neutrals.textPrimary:    { light: "#0f172a" }   # slate-900
    neutrals.textSecondary:  { light: "#475569" }   # slate-600
    accents.primary:         { light: "#14b8a6" }   # teal-500
    accents.onPrimary:       { light: "#0f172a" }   # slate-900
    accents.secondary:       { light: "#f59e0b" }   # amber-500
    accents.success:         { light: "#22c55e" }   # green-500
    accents.warning:         { light: "#f59e0b" }   # amber-500
    accents.error:           { light: "#ef4444" }   # red-500
    accents.info:            { light: "#0ea5e9" }   # sky-500
    interactionStates.hover:  { light: "#0d9488" }  # teal-600
    interactionStates.active: { light: "#0f766e" }  # teal-700
    interactionStates.focus:  { light: "#0d9488" }  # teal-600
  interactionStates:
    hover: "teal-600"    # one step darker than accents.primary (teal-500)
    active: "teal-700"
    focus: "teal-600"
  usagePolicy:
    primaryAccentRole: "accents.primary"     # teal-500 — free use
    secondaryAccentRole: "accents.secondary" # amber-500 — reserved
    maxSimultaneousSecondaryAccents: 1
    maxPrimaryActionsPerScreen: 1            # one unmissable primary action per screen

typography:
  typefaces:
    display: "Fraunces"
    body: "Inter"
    ui: "Inter"
  weights: [400, 500, 700]
  scale:
    baseSizePx: 16
    ratio: 1.25
    steps: ["xs", "sm", "base", "lg", "xl", "2xl", "3xl", "4xl", "5xl"]
  lineHeightRatio: 1.5
  styles:
    - { name: "page-title",      step: "3xl",  weight: 700, typeface: "display", appliesTo: ["h1"] }
    - { name: "section-heading", step: "xl",   weight: 700, typeface: "display", appliesTo: ["h2"] }
    - { name: "subheading",      step: "lg",   weight: 500, typeface: "body",    appliesTo: ["h3"] }
    - { name: "body",            step: "base", weight: 400, typeface: "body",    appliesTo: ["p"] }
    - { name: "label",           step: "sm",   weight: 500, typeface: "ui",      appliesTo: ["label"] }
  roles:
    heading: "typefaces.display"        # Fraunces, 700 weight
    readableSubtext: "typefaces.body"   # Inter, 400 weight, textSecondary color
    formLabel: "typefaces.ui"           # Inter, 500 weight, uppercase, textPrimary color
                                          # -> visually distinct from readableSubtext even
                                          # though both use Inter, so "fill this in" reads
                                          # differently from "here's context"

spacing:
  baseUnitPx: 4
  scale: [4, 8, 16, 24, 32, 48]
  roles:
    - { name: "card-padding",      px: 16, property: "padding",   appliesTo: ["Card", "StatTile"] }
    - { name: "control-padding-x", px: 16, property: "padding-x", appliesTo: ["Button", "Input"] }
    - { name: "control-padding-y", px: 8,  property: "padding-y", appliesTo: ["Button", "Input"] }
    - { name: "stack-related",     px: 8,  property: "gap" }
    - { name: "stack-group",       px: 24, property: "gap" }
    - { name: "section",           px: 48, property: "margin" }

radius:
  tokens:
    - { name: "radius-sm", px: 4, usage: "Inputs, chips, small buttons." }
    - { name: "radius-md", px: 8, usage: "Buttons, cards." }
    - { name: "radius-lg", px: 12, usage: "Panels, dialogs." }

layout:
  gridColumns: 12
  gutterPx: 24
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  containerMaxWidthPx: 1200
  alignmentTolerancePx: 0   # exact — every element lands on the grid

motion:
  durationsMs:
    micro: 150
    state: 300
    page: 500
  easing:
    entrance: "ease-out"
    exit: "ease-in"
    transition: "ease-in-out"
  respectReducedMotion: true

registryPolicy:
  onMissingComponent: "propose-and-wait"     # new component category entirely -> stop and ask
  onMissingVariant: "propose-and-continue"   # new flavor of an existing component -> draft it, flag as pending
  requireApprovalBeforeReuse: true
  requireOperationalVerification: true       # gap report alone never approves; a verification report must say ready-for-implementation
  verificationReviewer: "human-designer"
  similarityCheck:
    reuseThreshold: 0.7      # >= this -> reuse the approved component as-is
    extendThreshold: 0.4     # >= this (same base component) -> extend with a new variant; below -> new component
    weights:                 # must sum to 1.0; category match is a hard gate, not weighted
      propOverlap: 0.5
      variantOverlap: 0.35
      semanticNameSimilarity: 0.15
    onlyCompareApprovedStatus: true

components:
  - name: "Button"
    category: "action"
    status: "approved"
    importPath: "@/components/ui/button"
    props: ["size", "disabled", "loading"]
    description: "Primary interactive trigger."
    variants:
      - name: "primary"
        status: "approved"
      - name: "secondary"
        status: "approved"
      - name: "ghost"
        status: "approved"
      - name: "destructive"
        status: "approved"
      # Example of a variant that was created for a specific ticket and is
      # awaiting sign-off — the agent can reuse it on a NEW ticket only if
      # requireApprovalBeforeReuse is false, otherwise it re-flags it as pending.
      - name: "icon-only"
        status: "proposed"
        addedInTicket: "DES-481"
        addedDate: "2026-08-14"
        description: "Square button, icon centered, no label — requested for toolbar use."

  - name: "Card"
    category: "display"
    status: "approved"
    importPath: "@/components/ui/card"
    description: "Content container with border + background differentiation, no shadow."
    variants:
      - name: "default"
        status: "approved"
      - name: "outlined"
        status: "approved"

  - name: "Input"
    category: "input"
    status: "approved"
    importPath: "@/components/ui/input"
    variants:
      - name: "default"
        status: "approved"
      - name: "error"
        status: "approved"

  - name: "Toast"
    category: "feedback"
    status: "approved"
    importPath: "sonner"
    description: "Non-blocking notification."
    variants:
      - name: "default"
        status: "approved"

  - name: "Skeleton"
    category: "feedback"
    status: "approved"
    importPath: "@/components/ui/skeleton"
    description: "Loading placeholder, used until content renders."
    variants:
      - name: "default"
        status: "approved"

  - name: "Tabs"
    category: "navigation"
    status: "approved"
    importPath: "@/components/ui/tabs"
    variants:
      - name: "default"
        status: "approved"

  # Deliberately NOT included: any "feedback" or "data-viz" component with a
  # stat/metric variant. A ticket asking for a stats dashboard should trigger
  # a missing-COMPONENT gap here (not just a missing variant), since no
  # category member is a good fit at all.

icons:
  library: "@phosphor-icons/react"
  importPattern: "import { IconName } from '@phosphor-icons/react'"

accessibility:
  level: "AA"
  minTouchTargetPx: 44
  requireVisibleFocusStates: true
  requireSemanticHtml: true

automation:
  auditTrigger: "automatic-post-generation"
  maxAutoReviseAttempts: 2
  notifyOnAutoRevise: true

compositionHeuristics:
  maxCardInformationAreas: 5   # a front-facing card shows at most 5 pieces of information; the rest goes to its detail view
  maxToolsPerItem: 1           # an unselected item in a list or builder shows only its drag handle; its tools appear when selected
  listPaginationThreshold: 10
  maxInlineInputs: 7
  requireProgressiveDisclosure: true
  requireTicketPriorityTraceability: true

navigationHeuristics:
  maxItemsPerLevel: 7          # the most-used options at the top, the rest grouped one level down
  maxClicksToAnyOption: 2      # every option within 2 clicks of the navigation
  searchWhenOptionsOver: 15    # more options than this need a search
  maxVisibleControls: 12       # controls on the first screen at the narrowest width; nest the rest behind one labelled control
  requireNavigationalTies: true
  breadcrumbThresholdDepth: 2

briefPolicy:
  requireOptimization: true          # every brief goes through skills/design-agent/reference/brief-optimization.md
  approvalBeforeGeneration: true     # the author approves the optimized brief first
  requireAcceptanceCriteria: true
  requireEdgeCaseSweep: true       # skills/design-agent/reference/edge-case-sweep.md: every entity owned, every lens covered
  edgeCaseLenses: []                # your product's own lenses, e.g. { name: content-ratings, ask: "Age ratings for games?" }
  vocabulary: {}                     # your own terms, e.g. { hero: "Card/feature at the top of the page" }

mobile:
  minViewportPx: 320          # every screen reflows here with no sideways scrolling
  maxTextScalePercent: 200    # works with text at 200% (zoom, Dynamic Type, font scale)
  minTargetSpacingPx: 8
  maxFixedSizePx: 64          # icons/avatars/targets only; everything bigger is fluid
  textExpansionPercent: 40    # translated text can be 40% longer
  thumbZonePrimaryAction: true
  orientations: ["portrait", "landscape"]

development:
  uiPaths: ["src/**/*.tsx", "src/**/*.ts", "src/**/*.css"]
  tokenLint:
    mode: "block"          # off-token values send the edit back to be fixed
    framework: "both"      # Tailwind classes and CSS declarations
    allow: ["1px"]         # hairline borders
  designContext:
    onUnownedUi: "warn"

usabilityHeuristics:
  threeThreeThree:
    glanceSeconds: 3          # purpose + primary action understood at a glance
    glanceBreakpoint: "sm"    # judged at the smallest breakpoint
    maxClicksToCoreTask: 3
    maxCoreTaskMinutes: 3
  displayDesign:
    minReadableTextPx: 12     # Wickens 1 — legibility
    maxAbsoluteJudgmentLevels: 5   # Wickens 2 — unlabeled shades/sizes of one variable

scopePolicy:
  designIndexPath: "design-index.yaml"
  requireScopeCheck: true
  overlapCheck:
    mergeThreshold: 0.6      # >= this -> the brief belongs to that existing project
    relatedThreshold: 0.3    # >= this -> related: link, and reuse shared decisions/components
    weights:                 # must sum to 1.0
      termOverlap: 0.4
      surfaceOverlap: 0.35
      priorityOverlap: 0.25
  onOverlap: "ask"           # ask | auto-route | block
  changePropagation:
    flagDependentsOnChange: true
    flagSharedPatternProjects: true

motionUsagePolicy:
  requireLoadingAnimation: true
  requireDataVizAnimation: true
