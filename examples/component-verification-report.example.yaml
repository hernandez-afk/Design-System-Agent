id: "DES-512-gap-1-verify"
componentName: "StatTile"
gapReportId: "DES-512-gap-1"
reviewedAt: "2026-09-10T14:20:00Z"

operationalSpec:
  purpose: "Displays one KPI with its current value and trend direction, at a glance, without requiring interaction."
  states:
    - name: "default"
      description: "Label, value, and trend indicator all visible; neutral trend has no arrow, only a dash."
      implemented: true
    - name: "loading"
      description: "Skeleton placeholder matching the tile's dimensions while the value fetches — per motionUsagePolicy.requireLoadingAnimation."
      implemented: true
    - name: "error"
      description: "Value replaced with 'Unable to load' and a retry affordance; label stays visible so context isn't lost."
      implemented: true
    - name: "focus"
      description: "N/A — tile is not interactive/focusable in this iteration (read-only display). Documented under whenNotToUse."
      implemented: false
      notApplicable: true
      notApplicableReason: "Read-only display with no drill-down in the ticket brief (P1 asks only for at-a-glance visibility) — see whenNotToUse and the 'Tile is not interactive/focusable' rationale entry."
  props:
    - name: "label"
      type: "string"
      required: true
      description: "The metric name, e.g. 'Active Users'."
    - name: "value"
      type: "string"
      required: true
    - name: "trend"
      type: "'up' | 'down' | 'neutral'"
      required: false
      description: "Defaults to 'neutral' if omitted."
    - name: "deltaLabel"
      type: "string"
      required: false
      description: "e.g. '+4.2% vs last period' — optional supporting text under the value."
  responsiveBehavior:
    - breakpoint: "sm"
      behavior: "4 tiles stack 2x2, not a horizontal scroll — keeps all 4 visible without interaction, per P1 in the ticket brief."
    - breakpoint: "md"
      behavior: "4 tiles in a single row, per original layout intent."
  whenNotToUse: "Not for metrics needing drill-down or comparison over time in place — that's a chart, category data-viz but a different component. Not currently interactive; if a future ticket needs click-to-drill-down, that's a new variant, not a silent addition to this one."

dynamicBehavior:
  sizing: "Fills its grid cell; min 144px wide, no max. Height from content (label, value, delta)."
  containerAdaptation:
    - containerWidth: "< 160px"
      behavior: "Delta label moves under the value; value drops one type step so it never wraps."
    - containerWidth: "160–280px"
      behavior: "Default: label, value, trend arrow and delta on two lines."
    - containerWidth: "> 280px"
      behavior: "Same layout; extra width becomes padding, the tile doesn't stretch its text."
  contentHandling:
    short: "Short labels keep the tile at its minimum height, so a row of tiles stays aligned."
    long: "Labels wrap to two lines, then truncate with the full label in the tile's accessible name and a tooltip on focus/hover; +40% translated labels tested."
    empty: "No value → the error state ('Unable to load' + retry); no delta → the delta line is omitted, not left blank."
    overflow: "Very large values abbreviate (1.2M) with the exact value in the accessible name."
  textScaling:
    testedAtPercent: 200
    result: "Tiles grow taller and the 2×2 phone grid becomes 1 column below 160px per tile; nothing clips."
  inputModes:
    touch: "Read-only; no touch targets inside the tile."
    pointer: "Tooltip on truncated labels."
    keyboard: "Not focusable (read-only), except the retry button in the error state."
  orientationAndSafeArea: "Landscape phones show all four tiles in one row when each gets ≥ 160px; otherwise 2×2."
  dataDriven: "Label, value, trend and delta all come in through props; nothing is hard-coded."

designRationale:
  - decision: "Trend uses an arrow icon plus color, not color alone."
    reasoning: "Color can't be the only signal for state — rubric category 2 (Accessibility), and accessibility.requireSemanticHtml implies non-color-dependent state communication."
    principleOrTokenRef: "design-audit-rubric.md category 2"
  - decision: "Value uses typography.roles.heading weight, label uses typography.roles.readableSubtext."
    reasoning: "Establishes the value as the primary thing being scanned, label as supporting context — matches Hierarchy Drives Everything's 'visual weight must match functional importance.'"
    principleOrTokenRef: "design-principles.md: Hierarchy Drives Everything"
  - decision: "Gap between tiles is spacing.scale's 24px step, not 20px."
    reasoning: "No off-scale spacing values, per Consistency Is Non-Negotiable — corrects the 20px value flagged in the earlier audit-report example."
    principleOrTokenRef: "spacing.scale"
  - decision: "Tile is not interactive/focusable."
    reasoning: "No stated requirement in the ticket brief for drill-down (P1 only asks for at-a-glance visibility); adding unneeded interactivity would violate Simplicity Is Architecture's 'every element must justify its existence.'"
    principleOrTokenRef: "design-principles.md: Simplicity Is Architecture; ticket-brief P1"

verification:
  allStatesImplemented: true    # focus is marked notApplicable (with a reason), so it doesn't count against this
  accessibilityPass: true
  tokenCompliant: true
  dynamicPass: true
  notes: "Focus state intentionally not implemented since the component is non-interactive by design — marked notApplicable with a reason rather than skipped silently. See whenNotToUse."
  checkedBy: "human-designer"

verdict: "ready-for-implementation"
