<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire builder: builder pattern test page</title>
<!-- A test page for the builder checks (tools/screenshots.py with standard/design-system-manifest.yaml).
     Planted problems: questions can only be reordered by dragging (no Move up / Move down), and every
     question shows all its tools at once instead of only the selected one. -->
<style>
  body { margin: 0; background: #fafafa; color: #18181b; font-family: "Source Sans 3", sans-serif; font-size: 1rem; line-height: 1.5; }
  main { padding: 1rem; display: grid; gap: 1rem; }
  h1 { font-family: "Source Serif 4", serif; margin: 0; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  li { padding: 1rem; background: #fff; border: 1px solid #d4d4d8; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  button { font: inherit; min-height: 44px; min-width: 44px; }
</style>
</head>
<body>
<main>
  <h1>Feedback questionnaire</h1>
  <ol>
    <li draggable="true"><span>How would you rate the event?</span><button>Type</button><button>Required</button><button>Duplicate</button><button>Delete</button></li>
    <li draggable="true"><span>What should we keep?</span><button>Type</button><button>Required</button><button>Duplicate</button><button>Delete</button></li>
    <li draggable="true"><span>Which talk helped most?</span><button>Type</button><button>Required</button><button>Duplicate</button><button>Delete</button></li>
  </ol>
  <button class="primary" style="background:#1d4ed8;color:#fff">Publish</button>
</main>
</body>
</html>
