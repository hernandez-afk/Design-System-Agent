<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback questionnaire builder</title>
<!-- A reference for the builder pattern (DES-610, skills/design-agent/reference/page-patterns.md), in the Baseline
     tokens: one column of question cards; the selected question shows its tools, every other question shows only
     its title, type and a drag handle; Move up / Move down in the question's menu as the alternative to dragging;
     add a question at the end; autosave state next to Preview and Publish. -->
<style>
  :root { --bg: #fafafa; --surface: #ffffff; --border: #d4d4d8; --text: #18181b; --muted: #52525b; --primary: #1d4ed8; --focus: #1d4ed8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Source Sans 3", sans-serif; font-size: 1rem; line-height: 1.5; }
  main { max-width: 45rem; margin: 0 auto; padding: 1rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
  .crumb a { color: var(--muted); display: inline-flex; align-items: center; min-height: 44px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .toolbar .saved { color: var(--muted); margin-right: auto; }
  h1 { font-family: "Source Serif 4", serif; font-size: 2.0625rem; font-weight: 700; margin: 0; line-height: 1.2; overflow-wrap: anywhere; hyphens: auto; }
  button, select, input[type=text] { font: inherit; min-height: 44px; border-radius: 4px; }
  button { padding: 12px 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  button.primary { background: var(--primary); border-color: var(--primary); color: #ffffff; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
  .q { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.5rem; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .q[aria-selected=true] { border-color: var(--primary); outline: 1px solid var(--primary); }
  .handle { width: 44px; min-width: 44px; padding: 0; border: 0; background: transparent; color: var(--muted); }
  .q > div { flex: 1 1 10rem; min-width: 0; }
  .q p { margin: 0; }
  .type { color: var(--muted); font-size: 0.8125rem; }
  .edit { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.5rem; min-width: 0; }
  .edit input[type=text], .edit select { width: 100%; min-width: 0; max-width: 100%; padding: 0 0.75rem; border: 1px solid var(--border); background: var(--surface); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  [role=switch][aria-checked=true]::before { content: "● "; color: var(--primary); }
  details { position: relative; }
  summary { list-style: none; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
  details ul { list-style: none; margin: 0.25rem 0 0; padding: 0.25rem; position: absolute; right: 0; z-index: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <nav class="crumb" aria-label="Breadcrumb"><a href="#">Spring Hackathon 2026</a></nav>
  <h1>Feedback questionnaire</h1>
  <div class="toolbar">
    <span class="saved" role="status">Draft · saved</span>
    <button>Preview</button>
    <button class="primary">Publish</button>
  </div>
  <ol data-sortable aria-label="Questions">
    <li class="q" aria-selected="true" draggable="true">
      <button class="handle" aria-label="Drag to reorder">⠿</button>
      <div class="edit">
        <label class="sr" for="q1">Question</label>
        <input id="q1" type="text" value="How would you rate the event?">
        <select aria-label="Question type"><option>1 to 5 scale</option><option>Short answer</option><option>Paragraph</option><option>One choice</option><option>Several choices</option></select>
        <div class="row">
          <button role="switch" aria-checked="true">Required</button>
          <details>
            <summary aria-label="More actions for this question">⋯</summary>
            <ul>
              <li><button>Move up</button></li><li><button>Move down</button></li>
              <li><button>Duplicate</button></li><li><button>Delete</button></li>
            </ul>
          </details>
        </div>
      </div>
    </li>
    <li class="q" draggable="true">
      <button class="handle" aria-label="Drag to reorder">⠿</button>
      <div><p>What should we keep for next time?</p><p class="type">Paragraph</p></div>
    </li>
    <li class="q" draggable="true">
      <button class="handle" aria-label="Drag to reorder">⠿</button>
      <div><p>Which talk was most useful?</p><p class="type">One choice</p></div>
    </li>
    <li class="q" draggable="true">
      <button class="handle" aria-label="Drag to reorder">⠿</button>
      <div><p>Would you come back?</p><p class="type">One choice</p></div>
    </li>
  </ol>
  <button>Add question</button>
</main>
</body>
</html>
