<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — DES-512 prototype</title>
<!-- A prototype of the DES-512 dashboard in the Acme tokens, for tools/screenshots.py.
     It has five planted problems for the screenshot review to find:
     a table that scrolls the page sideways on phones, a 32px icon button,
     11px caption text, a card with off-role padding, and a label clipped at 200% text. -->
<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #475569;
    --primary: #14b8a6; --on-primary: #0f172a; --hover: #0d9488;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 1rem; line-height: 1.5; }
  main { max-width: 75rem; margin: 0 auto; padding: 1rem; display: grid; gap: 1.5rem; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 2rem; font-weight: 700; margin: 0; }
  h2 { font-family: Fraunces, Georgia, serif; font-size: 1.5625rem; font-weight: 700; margin: 0 0 0.5rem; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .icon-button { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--surface); border-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { min-height: 44px; padding: 0.5rem 1rem; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; font: inherit; }
  .chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
  @media (min-width: 768px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  .tile-label { color: var(--muted); font-size: 0.8125rem; height: 20px; overflow: hidden; }
  .tile-value { font-size: 1.5625rem; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
  .caption { color: var(--muted); font-size: 11px; }
  table { border-collapse: collapse; min-width: 480px; }
  th, td { text-align: left; padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Dashboard</h1>
    <button class="icon-button" aria-label="Refresh">↻</button>
  </header>
  <div class="chips" role="group" aria-label="Date range">
    <button class="chip" aria-pressed="false">7d</button>
    <button class="chip" aria-pressed="true">30d</button>
    <button class="chip" aria-pressed="false">90d</button>
  </div>
  <section class="kpis" aria-label="Key metrics">
    <div class="tile" data-component="StatTile"><div class="tile-label">Active users this month</div><div class="tile-value">12,480 ↑</div></div>
    <div class="tile" data-component="StatTile"><div class="tile-label">Revenue</div><div class="tile-value">$84.2k ↑</div></div>
    <div class="tile" data-component="StatTile"><div class="tile-label">Churn</div><div class="tile-value">2.1% ↓</div></div>
    <div class="tile" data-component="StatTile"><div class="tile-label">NPS</div><div class="tile-value">48 –</div></div>
  </section>
  <section class="card" data-component="Card">
    <h2>Recent reports</h2>
    <p class="caption">Updated 2 minutes ago</p>
    <table>
      <thead><tr><th>Report</th><th>Owner</th><th>Last run</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Weekly revenue</td><td>Finance</td><td>Mon 09:00</td><td>Done</td></tr>
        <tr><td>Churn by plan</td><td>Growth</td><td>Sun 18:30</td><td>Done</td></tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>
