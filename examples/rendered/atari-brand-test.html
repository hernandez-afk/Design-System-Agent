<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade night: Atari brand test page</title>
<!-- A test page for the Atari brand check (tools/screenshots.py with standard/design-system-manifest.yaml,
     which lists standard/brand/atari.yaml). Planted problems: the Fuji logo in Bright Red and 40px wide,
     a Box lockup with 8px of clear space, a rotated horizontal lockup, a headline not in capitals,
     body text in Poppins Regular instead of Medium, a button red that's nearly Atari Red, an
     off-palette green, and "atari" in lowercase. Correct: the wordmark in Atari Red at 96px. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F5F5F5; color: #171717; font-family: Poppins, sans-serif; font-weight: 500; font-size: 1rem; line-height: 1.5; }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem; display: grid; gap: 1.5rem; }
  h1 { font-family: "Atari 1972", sans-serif; font-weight: 400; font-size: 2.5rem; margin: 0; }
  .intro { font-weight: 400; }
  .row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  button { font: inherit; min-height: 44px; padding: 0.5rem 1rem; border: 0; border-radius: 4px; background: #E3202C; color: #FFFFFF; }
  .tag { background: #22c55e; color: #171717; padding: 0.25rem 0.5rem; border-radius: 4px; }
  .tilted { transform: rotate(5deg); }
</style>
</head>
<body>
<main>
  <div class="row">
    <svg data-brand-asset="atari-fuji" aria-label="Atari" width="40" height="40" viewBox="0 0 40 40"><path d="M4 36 L16 4 L24 4 L36 36 Z" fill="#FF0000"/></svg>
    <svg data-brand-asset="atari-wordmark" aria-label="Atari" width="96" height="24" viewBox="0 0 96 24"><rect width="96" height="24" fill="#E01E2B"/></svg>
  </div>
  <h1>Arcade night</h1>
  <p class="intro">Play the classics on the new atari console, all weekend.</p>
  <div class="row">
    <svg data-brand-asset="atari-box" aria-label="Atari" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#E01E2B"/><path d="M30 80 L45 20 L55 20 L70 80 Z" fill="#FFFFFF"/></svg>
    <p>Doors open at 6pm.</p>
  </div>
  <div class="row"><button>Get tickets</button><span class="tag">New</span></div>
  <svg class="tilted" data-brand-asset="atari-horizontal" aria-label="Atari" width="200" height="40" viewBox="0 0 200 40"><rect width="200" height="40" fill="#E01E2B"/></svg>
</main>
</body>
</html>
