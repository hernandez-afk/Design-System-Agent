# Atari: the reference design system for work that follows the Atari brand guidelines.
#
# It is NOT the project's design system. It applies only when the Atari
# guidelines are called for: a brief or design that declares
# brandGuidelines: ["Atari"], a page with <meta name="brand-guidelines" content="Atari">,
# a file with a "brand-guidelines: Atari" comment, or text asking to follow the
# Atari brand guidelines. Everything else uses the project's own design system.
#
# Built from ATARI Brand Guidelines V1.1 (June 2023) on the Baseline's structure:
# every color is an exact Atari palette color (the palette is strict), type is
# Atari 1972 for headlines and Poppins Medium for everything else. What the
# guidelines don't cover (spacing, radius, layout, components, behavior) is the
# Baseline's, marked "not in the guidelines".
# Brand rules: ../atari.yaml. Check: python3 tools/check_compatibility.py standard/brand/atari/design-system-manifest.yaml

harness:
  mode: "lite"             # lite: core skill + tool checks + one critic pass. full: every record and the full rubric

platform:
  targets: ["claude-code", "claude-design"]
  claudeDesign:
    designSystemUrl: ""
    markAsDefault: true
    recordStore: "repo"
    canvasBoards:
      phone: { w: 390, h: 844 }
      desktop: { w: 1440, h: 900 }

meta:
  name: "Atari"
  version: "1.0.0"
  framework: "react"
  stylingEngine: "css-variables"
  decisionProtocol: "always-ask"
  claudeMd:
    path: "CLAUDE.md"
    required: true
  brandExclusions:        # universal defaults — add your brand's own bans
    - "glass morphism"
    - "gradient washes as backgrounds"
    - "drop shadows for depth (use border + surface color)"
    - "emoji as icons"
    - "color as the only signal for a state"

brandGuidelines:
  - profile: "../atari.yaml"
    applies: "always"      # this system is Atari's: its tokens and every page built with it are checked

contentPolicy:            # say less: every block short, and a first screen that's scanned, not read
  maxWordsPerBlock: 30     # a paragraph, helper text or description; the rest goes behind a disclosure
  maxSentencesPerBlock: 2
  maxIntroWords: 20        # the line under a page or section title
  maxWordsFirstScreen: 60  # before the first scroll at the narrowest width, so the title and primary action stand out in 3 s
  maxWordsPerScreen: 250
  maxNumbersInProse: 2     # more figures than this in a sentence become stats, a table or a chart
  taskTime: { readingWordsPerMinute: 200, secondsPerField: 8, secondsPerChoice: 3 }   # the 3-minute estimate
  persistentChrome:        # the top bar, sidebars, anything fixed or sticky: on every screen, so it holds only what every screen needs
    maxInfoItems: 0        # beyond the logo, page title, navigation and controls; mark a real exception data-essential (e.g. a live countdown)
    # ambientTerms: roles, plans, environments, "signed in as": default list in tools/screenshots.py
  # Long-form text (articles, legal, help) sits in [data-longform] and is exempt.

antiAiDesign:             # what AI-made designs tend to get wrong; the renderer measures these
  repetition: { enabled: true, minWords: 3, figures: true }   # say each thing once per screen
  typefaces:
    maxFamilies: 2        # plus one mono; the default-font list is in tools/brand_check.py

color:                     # every value is an exact Atari palette color (guidelines p. 22-25)
  neutrals:
    background: "#FFFFFF"    # White
    surface: "#F5F5F5"       # White 5
    border: "#E0E0E0"        # Light Grey 15
    textPrimary: "#171717"   # Black 100
    textSecondary: "#616161" # Dark Grey 70: 5.7:1 on surface
    temperature: "neutral"
  accents:
    primary: "#E01E2B"       # Atari Red
    onPrimary: "#FFFFFF"     # 4.8:1 on Atari Red
    secondary: "#A4009F"     # Purple 100, distinct from every status color
    success: "#4D6A31"       # Spectrum PMS 7743 C
    warning: "#AD582A"       # Spectrum PMS 1605 C (Yellow 100 fails as text)
    error: "#BD1E56"         # Spectrum PMS 7425 C, not Atari Red, so an error never reads as the primary action
    info: "#0065B9"          # Blue 100
  contrastStandard: "WCAG-AA"
  interactionStates:
    hover: "#C14340"         # Spectrum PMS 180 C
    active: "#6C302E"        # Spectrum PMS 175 C
    focus: "#0065B9"         # Blue 100: a focus ring that isn't the brand red
  usagePolicy:
    primaryAccentRole: "accents.primary"
    secondaryAccentRole: "accents.secondary"
    maxSimultaneousSecondaryAccents: 1
    maxPrimaryActionsPerScreen: 1
  themes:
    - { id: "light", name: "Light" }
  resolved:
    neutrals.background:      { light: "#FFFFFF" }
    neutrals.surface:         { light: "#F5F5F5" }
    neutrals.border:          { light: "#E0E0E0" }
    neutrals.textPrimary:     { light: "#171717" }
    neutrals.textSecondary:   { light: "#616161" }
    accents.primary:          { light: "#E01E2B" }
    accents.onPrimary:        { light: "#FFFFFF" }
    accents.secondary:        { light: "#A4009F" }
    accents.success:          { light: "#4D6A31" }
    accents.warning:          { light: "#AD582A" }
    accents.error:            { light: "#BD1E56" }
    accents.info:             { light: "#0065B9" }
    interactionStates.hover:  { light: "#C14340" }
    interactionStates.active: { light: "#6C302E" }
    interactionStates.focus:  { light: "#0065B9" }

typography:                # guidelines p. 27-29
  typefaces:
    display: "Atari 1972"    # headlines, Regular, in capitals
    body: "Poppins"          # subheads, body, captions, legal: Medium
    ui: "Poppins"
  weights: [400, 500]        # Atari 1972 Regular; Poppins Medium
  scale:
    baseSizePx: 16
    ratio: 1.25
    steps: ["sm", "base", "lg", "xl", "2xl", "3xl"]   # 13 · 16 · 20 · 25 · 31 · 39px
  lineHeightRatio: 1.5
  styles:
    - { name: "page-title",      step: "3xl",  weight: 400, typeface: "display", appliesTo: ["h1"], usage: "In capitals." }
    - { name: "section-heading", step: "xl",   weight: 400, typeface: "display", appliesTo: ["h2"], usage: "In capitals." }
    - { name: "subheading",      step: "lg",   weight: 500, typeface: "body",    appliesTo: ["h3"] }
    - { name: "body",            step: "base", weight: 500, typeface: "body",    appliesTo: ["p"] }
    - { name: "label",           step: "sm",   weight: 500, typeface: "ui",      appliesTo: ["label"], usage: "In textPrimary." }
    - { name: "caption",         step: "sm",   weight: 500, typeface: "body",    usage: "Captions and legal lines, in textSecondary." }
  roles:
    heading: "typefaces.display"        # Atari 1972, 400, capitals
    readableSubtext: "typefaces.body"   # Poppins, 500, textSecondary
    formLabel: "typefaces.ui"           # Poppins, 500, textPrimary

spacing:                   # not in the guidelines: the Baseline's
  baseUnitPx: 4
  scale: [4, 8, 12, 16, 24, 32, 48, 64]
  roles:                   # the same kind of space is the same value everywhere
    - { name: "card-padding",      px: 16, property: "padding",   appliesTo: ["Card", "Dialog", "InlineAlert"] }
    - { name: "control-padding-x", px: 16, property: "padding-x", appliesTo: ["Button", "Input", "Select"] }
    - { name: "control-padding-y", px: 12, property: "padding-y", appliesTo: ["Button", "Input", "Select"] }
    - { name: "stack-related",     px: 8,  property: "gap", usage: "Label to field; items in one group." }
    - { name: "stack-group",       px: 24, property: "gap", usage: "Between groups of related items." }
    - { name: "section",           px: 48, property: "margin", usage: "Between page sections." }
    - { name: "page-gutter",       px: 16, property: "padding-x", usage: "Page edges on phones; the grid gutter takes over from md." }

radius:                    # not in the guidelines: the Baseline's
  tokens:
    - { name: "radius-sm", px: 4, usage: "Inputs, chips, small buttons." }
    - { name: "radius-md", px: 8, usage: "Buttons, cards." }
    - { name: "radius-lg", px: 12, usage: "Dialogs, panels." }

layout:
  gridColumns: 12
  gutterPx: 24
  breakpoints: { sm: 640, md: 768, lg: 1024, xl: 1280 }
  containerMaxWidthPx: 1200
  alignmentTolerancePx: 0

motion:
  durationsMs: { micro: 150, state: 300, page: 500 }
  easing: { entrance: "ease-out", exit: "ease-in", transition: "ease-in-out" }
  respectReducedMotion: true

icons:
  library: "lucide-react"
  importPattern: "import { IconName } from 'lucide-react'"

accessibility:
  level: "AA"
  minTouchTargetPx: 44
  requireVisibleFocusStates: true
  requireSemanticHtml: true

# The baseline component set: each one exists because a rubric check needs it
# (see REQUIREMENTS.md, "Baseline components"). All approved, all with props,
# so the similarity check has something to compare against.
components:
  - name: "Button"
    category: "action"
    status: "approved"
    importPath: "@/components/ui/button"
    props: ["size", "disabled", "loading", "onClick"]
    description: "Every clickable action. One primary per screen."
    variants:
      - { name: "primary", status: "approved", description: "The one primary action." }
      - { name: "secondary", status: "approved" }
      - { name: "ghost", status: "approved", description: "Low-emphasis actions, back buttons." }
      - { name: "destructive", status: "approved", description: "Irreversible actions; always paired with Dialog/confirm-destructive or an undo." }

  - name: "Input"
    category: "input"
    status: "approved"
    importPath: "@/components/ui/input"
    props: ["label", "value", "onChange", "disabled", "error", "helperText"]
    description: "Text entry with a visible label (formLabel role)."
    variants:
      - { name: "default", status: "approved" }
      - { name: "error", status: "approved", description: "Error text + icon + border color." }

  - name: "Switch"
    category: "input"
    status: "approved"
    importPath: "@/components/ui/switch"
    props: ["label", "checked", "onChange", "disabled", "description"]
    description: "On/off that takes effect immediately. Label says what's on; the whole row is the touch target."
    variants:
      - { name: "default", status: "approved" }

  - name: "Checkbox"
    category: "input"
    status: "approved"
    importPath: "@/components/ui/checkbox"
    props: ["label", "checked", "onChange", "disabled", "indeterminate"]
    description: "Choices applied when a form is submitted. Label is part of the touch target."
    variants:
      - { name: "default", status: "approved" }

  - name: "RadioGroup"
    category: "input"
    status: "approved"
    importPath: "@/components/ui/radio-group"
    props: ["label", "options", "value", "onChange", "disabled"]
    description: "One of up to 5 options, all visible: one tap, nothing to open (Wickens 8)."
    variants:
      - { name: "default", status: "approved" }

  - name: "Select"
    category: "input"
    status: "approved"
    importPath: "@/components/ui/select"
    props: ["label", "options", "value", "onChange", "disabled", "error"]
    description: "One of 6 or more options. Uses the platform's native picker on phones."
    variants:
      - { name: "default", status: "approved" }

  - name: "Card"
    category: "display"
    status: "approved"
    importPath: "@/components/ui/card"
    props: ["children", "padding"]
    description: "Content container; border + surface color, no shadow."
    variants:
      - { name: "default", status: "approved" }
      - { name: "outlined", status: "approved" }

  - name: "InlineAlert"
    category: "feedback"
    status: "approved"
    importPath: "@/components/ui/inline-alert"
    props: ["tone", "title", "children", "icon"]
    description: "Persistent in-page status. Icon + text + color, never color alone."
    variants:
      - { name: "info", status: "approved" }
      - { name: "success", status: "approved" }
      - { name: "warning", status: "approved" }
      - { name: "error", status: "approved" }

  - name: "Toast"
    category: "feedback"
    status: "approved"
    importPath: "@/components/ui/toast"
    props: ["tone", "message", "action", "duration"]
    description: "Brief, non-blocking confirmation of a completed action."
    variants:
      - { name: "default", status: "approved" }

  - name: "Skeleton"
    category: "feedback"
    status: "approved"
    importPath: "@/components/ui/skeleton"
    props: ["width", "height", "lines"]
    description: "Loading placeholder shaped like the content it replaces."
    variants:
      - { name: "default", status: "approved" }

  - name: "EmptyState"
    category: "feedback"
    status: "approved"
    importPath: "@/components/ui/empty-state"
    props: ["title", "description", "action"]
    description: "What an empty list or view shows, with the next step."
    variants:
      - { name: "default", status: "approved" }

  - name: "Dialog"
    category: "overlay"
    status: "approved"
    importPath: "@/components/ui/dialog"
    props: ["open", "title", "children", "onConfirm", "onCancel", "confirmLabel"]
    description: "User-initiated modal. The confirm variant guards destructive actions."
    variants:
      - { name: "default", status: "approved" }
      - { name: "confirm-destructive", status: "approved", description: "States the consequence; the confirm button names the action." }

  - name: "Breadcrumb"
    category: "navigation"
    status: "approved"
    importPath: "@/components/ui/breadcrumb"
    props: ["items"]
    description: "Trail back up the hierarchy, required below breadcrumbThresholdDepth."
    variants:
      - { name: "default", status: "approved" }

  - name: "Pagination"
    category: "navigation"
    status: "approved"
    importPath: "@/components/ui/pagination"
    props: ["page", "pageCount", "onPageChange"]
    description: "For any list longer than listPaginationThreshold; shows position."
    variants:
      - { name: "default", status: "approved" }

  - name: "Tabs"
    category: "navigation"
    status: "approved"
    importPath: "@/components/ui/tabs"
    props: ["items", "value", "onChange"]
    description: "Switch between peer views of the same object."
    variants:
      - { name: "default", status: "approved" }

registryPolicy:
  onMissingComponent: "propose-and-wait"
  onMissingVariant: "propose-and-continue"
  requireApprovalBeforeReuse: true
  requireOperationalVerification: true
  verificationReviewer: "human-designer"
  similarityCheck:
    reuseThreshold: 0.7
    extendThreshold: 0.4
    weights: { propOverlap: 0.5, variantOverlap: 0.35, semanticNameSimilarity: 0.15 }
    onlyCompareApprovedStatus: true

automation:
  auditTrigger: "automatic-post-generation"
  maxAutoReviseAttempts: 1    # each revise loop re-runs the checks and the critic: one is usually enough
  notifyOnAutoRevise: true

compositionHeuristics:
  maxCardInformationAreas: 5   # a front-facing card shows at most 5 pieces of information; the rest goes to its detail view
  maxToolsPerItem: 1           # an unselected item in a list or builder shows only its drag handle; its tools appear when selected
  listPaginationThreshold: 10
  maxInlineInputs: 7
  requireProgressiveDisclosure: true
  requireTicketPriorityTraceability: true

navigationHeuristics:
  maxItemsPerLevel: 7          # the most-used options at the top, the rest grouped one level down
  maxClicksToAnyOption: 2      # every option within 2 clicks of the navigation
  searchWhenOptionsOver: 15    # more options than this need a search
  maxVisibleControls: 12       # controls on the first screen at the narrowest width; nest the rest behind one labelled control
  requireNavigationalTies: true
  breadcrumbThresholdDepth: 2

motionUsagePolicy:
  requireLoadingAnimation: true
  requireDataVizAnimation: true

briefPolicy:
  requireOptimization: true          # every brief goes through skills/design-agent/reference/brief-optimization.md
  approvalBeforeGeneration: true     # the author approves the optimized brief first
  requireAcceptanceCriteria: true
  requireEdgeCaseSweep: true       # skills/design-agent/reference/edge-case-sweep.md: every entity owned, every lens covered
  edgeCaseLenses: []                # your product's own lenses, e.g. { name: content-ratings, ask: "Age ratings for games?" }
  vocabulary: {}                     # your own terms, e.g. { hero: "Card/feature at the top of the page" }

mobile:
  minViewportPx: 320          # every screen reflows here with no sideways scrolling
  maxTextScalePercent: 200    # works with text at 200% (zoom, Dynamic Type, font scale)
  minTargetSpacingPx: 8
  maxFixedSizePx: 64          # icons/avatars/targets only; everything bigger is fluid
  textExpansionPercent: 40    # translated text can be 40% longer
  thumbZonePrimaryAction: true
  orientations: ["portrait", "landscape"]

development:
  uiPaths: ["src/**/*.tsx", "src/**/*.ts", "src/**/*.css"]
  tokenLint: { mode: "block", framework: "both", allow: ["1px"] }
  designContext: { onUnownedUi: "warn" }

usabilityHeuristics:
  threeThreeThree: { glanceSeconds: 3, glanceBreakpoint: "sm", maxClicksToCoreTask: 3, maxCoreTaskMinutes: 3 }
  displayDesign: { minReadableTextPx: 12, maxAbsoluteJudgmentLevels: 5 }

scopePolicy:
  designIndexPath: "design-index.yaml"
  requireScopeCheck: true
  overlapCheck:
    mergeThreshold: 0.6
    relatedThreshold: 0.3
    weights: { termOverlap: 0.4, surfaceOverlap: 0.35, priorityOverlap: 0.25 }
  onOverlap: "ask"
  changePropagation: { flagDependentsOnChange: true, flagSharedPatternProjects: true }
